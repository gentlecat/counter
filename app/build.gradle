buildscript {
    dependencies {
        classpath 'com.github.spotbugs.snom:spotbugs-gradle-plugin:6.5.13'
        classpath 'com.puppycrawl.tools:checkstyle:10.26.1'
    }
}

apply plugin: 'com.android.application'
apply plugin: 'com.android.legacy-kapt'

apply plugin: 'idea'


dependencies {

    // Android stuff
    implementation 'androidx.appcompat:appcompat-resources:1.8.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.11.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'com.android.support:multidex:1.0.3'
    implementation 'com.google.android.material:material:1.14.0'

    implementation 'com.google.guava:guava:33.7.2-jre'
    implementation 'javax.inject:javax.inject:1'
    implementation 'joda-time:joda-time:2.15.0'
    implementation 'org.apache.commons:commons-csv:1.14.1'
    implementation 'org.apache.commons:commons-text:1.15.0'

    compileOnly 'javax.annotation:jsr250-api:1.0'

    kapt 'com.google.dagger:dagger-compiler:2.60.1'
    kapt 'com.google.dagger:dagger-android-processor:2.60.1'
    api 'com.google.dagger:dagger-android-support:2.60.1'
    api 'com.google.dagger:dagger-android:2.60.1'
    api 'com.google.dagger:dagger:2.60.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.24.0'

    // For some reason without this build fails with duplicate classes exception.
    implementation(platform('org.jetbrains.kotlin:kotlin-bom:2.4.21'))
}

android {
    compileSdk = rootProject.ext.compileSdkVersion

    compileOptions.incremental = false

    buildFeatures.buildConfig = true

    defaultConfig {
        minSdk = rootProject.ext.minSdkVersion
        targetSdk = rootProject.ext.targetSdkVersion

        namespace 'me.tsukanov.counter'
        applicationId 'me.tsukanov.counter'
        versionCode rootProject.ext.appVersion
        versionName "${rootProject.ext.appVersion}"

        testInstrumentationRunner "android.test.InstrumentationTestRunner"

        multiDexEnabled true
    }

    buildTypes {
        release {
            debuggable = false
            jniDebuggable = false
            pseudoLocalesEnabled = false

            shrinkResources = true
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
            includeAndroidResources = true
        }
    }

}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

apply plugin: 'com.github.spotbugs'
spotbugs {
    ignoreFailures = true
}

apply plugin: 'checkstyle'
checkstyle {
    configFile rootProject.file('checkstyle.xml')
    ignoreFailures false
    maxWarnings = 0
    showViolations true
}

tasks.register('checkstyle', Checkstyle) {
    source 'src/main/java'
    source 'src/test/java'
    include '**/*.java'
    classpath = files()
}

preBuild.dependsOn('checkstyle')
assemble.dependsOn('lint')
check.dependsOn('checkstyle')
