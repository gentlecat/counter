name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # Android build-tools (aapt2) only ship x86_64 Linux binaries.
    runs-on: amd64
    timeout-minutes: 30

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7

      - name: Set Up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: gradle

      - name: Set Up Android SDK
        uses: https://github.com/android-actions/setup-android@v4

      - name: Build with Gradle
        run: ./gradlew build
