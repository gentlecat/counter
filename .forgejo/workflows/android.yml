name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # Android build-tools (aapt2) only ship x86_64 Linux binaries.
    runs-on: amd64
    timeout-minutes: 30

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7

      - name: Set Up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: gradle

      - name: Set Up Android SDK
        uses: https://github.com/android-actions/setup-android@v4

      # gradle.properties gives the daemon 8 GB, and the Kotlin daemon inherits
      # it. Together with R8 and the test workers that's more than the runner
      # has, so the daemon gets killed. Use less memory and compile in-process.
      - name: Build with Gradle
        run: >-
          ./gradlew build
          -Dorg.gradle.jvmargs=-Xmx3g
          -Pkotlin.compiler.execution.strategy=in-process
          --max-workers=2
